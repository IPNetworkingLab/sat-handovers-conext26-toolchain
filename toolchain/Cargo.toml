[package]
name = "toolchain"
version = "0.1.0"
edition = "2024"

[dependencies]
constellation-builder = { path = "../constellation-builder" }
constellation = { path = "../constellation" }
convergence-simulator = { path = "../convergence-simulator" }
dune-core = { git = "https://github.com/nrybowski/DUNE.git", tag = "v0.3.0" }

clap = { version = "4.6.1", features = ["derive"] }
handover-filter = { path = "../handover-filter" }
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "1.1.2", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tqdm = "0.8.0"
tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.32"
tracing-appender = "0.2.5"
